---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_1_2_3_3 }}
mount:
  home_nosuid_options:
    title: 1.1.2.3.3 | Ensure nosuid option set on /home partition
    mountpoint: /home
    exists: true
    opts:
    - nosuid
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.3.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
file:
  home_nosuid_fstab_options:
     title: 1.1.2.3.3 | Ensure nosuid option set on /home partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/home.*nosuid.*/'
     meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.3.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
