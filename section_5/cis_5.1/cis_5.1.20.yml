---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_20 }}
file:
  ssh_permit_root:
    title: 5.1.20 | Ensure SSH PermitRootLogin is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)PermitRootLogin no/'
    - '!/^(?i)PermitRootLogin yes/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.20
      CISv8:
      - 5.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
