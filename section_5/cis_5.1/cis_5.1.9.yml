---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_5_1_9 }}
file:
  sshd_gssapiauth:
    title: 5.1.9 | Ensure sshd GSSAPIAuthentication is disabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - 'GSSAPIAuthentication no'
    - '!/^GSSAPIAuthentication yes/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.9
      CISv8:
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
