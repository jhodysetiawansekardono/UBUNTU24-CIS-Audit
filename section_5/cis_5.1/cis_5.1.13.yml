---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_13 }}
file:
  ssh_logingrace:
    title: 5.1.13 | Ensure sshd LoginGraceTime is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)LoginGraceTime ([1-9]|[1-5][0-9]|60)$/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.13
      CISv8:
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
