---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_3_1_1 }}
package:
  libpam-runtime:
    title: 5.3.1.1 | Ensure latest version of pam is installed
    installed: true
    versions:
      not:
      - '1.4.0-11ubuntu2.1'
      - '1.4.0-11ubuntu2.2'
      - '1.4.0-11ubuntu2.3'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.1
      CISv8:
      - 5.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  {{ end }}
{{ end }}

