---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_6 }}
command:
  auditd_priv_cmds_cnf:
    title: 6.2.3.6 | Ensure use of privileged commands is collected | Config
    exec: grep delete /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      CISv8:
      - 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - AU-3(1)
  {{ end }}
{{ end }}
