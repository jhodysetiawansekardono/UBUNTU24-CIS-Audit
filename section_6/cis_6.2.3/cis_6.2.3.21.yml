---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_21 }}
command:
  auditd_config_match:
    title: 6.2.3.21 | Ensure the audit configuration is immutable
    exec: augenrules --check
    exit-status: 0
    stdout:
    - '/.*: No change/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      CISv8:
      - 8.5
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
