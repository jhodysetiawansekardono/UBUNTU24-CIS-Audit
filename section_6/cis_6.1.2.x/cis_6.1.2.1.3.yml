---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_2_1_3 }}
    {{ if not .Vars.ubtu24cis_is_syslog_server }}
service:
  systemd-journal-upload.service:
    title: 6.1.2.1.3 | Ensure systemd-journal-upload is enabled and active
    name: systemd-journal-upload.service
    running: true
    enabled: true
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.1.3
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
