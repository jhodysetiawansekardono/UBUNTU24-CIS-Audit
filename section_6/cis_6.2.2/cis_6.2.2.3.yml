---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_2_3 }}
file:
  auditd_space_actions:
    title: 6.2.2.3 | Ensure system is disabled when audit logs are full
    path: /etc/audit/auditd.conf
    exists: true
    contents:
    - '/disk_full_action\s*=\s*(halt|single)/'
    - '/disk_error_action\s*=\s*(syslog|single|halt)/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.2.3
      CISv8:
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-8
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
