---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_4_4 }}
command:
  audit_logfile_dir_perms:
    title: 6.2.4.4 | Ensure the audit log file directory mode is configured
    exec: for dir in `dirname \`grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'\``; do stat -Lc " %n_%a" $dir; done
    exit-status: 0
    stdout:
    - '/.*_7(0|5)0$/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_system_type: {{ .Vars.system_type }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
