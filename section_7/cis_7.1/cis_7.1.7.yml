---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_1_7 }}
file:
  gshadow_perms:
    title: 7.1.7 | Ensure permissions on /etc/gshadow are configured
    path: /etc/gshadow
    exists: true
    owner: root
    group:
      or:
      - root
      - shadow
    mode:
      or:
      - "0640"
      - "0600"
      - "0400"
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.7
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
