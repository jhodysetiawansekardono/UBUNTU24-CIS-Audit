---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_2_1 }}
file:
  shadowed_passwds:
    title: 7.2.1 | Ensure accounts in /etc/passwd use shadowed passwords
    path: /etc/passwd
    exists: true
    contents:
    - '/^.*:x:/'
    meta:
      host_os_release: {{ .Vars.os_release }}
      host_system_type: {{ .Vars.system_type }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_hostname: {{ .Vars.os_hostname }}
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.1
      CISv8: 3.11
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
